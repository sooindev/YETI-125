# 코드를 올릴 때마다 테스트를 돌린다.
#
# 예전에는 배포 스크립트가 -DskipTests 로 빌드해서, 손으로 mvn test 를 칠 때만
# 확인이 됐다. 깨진 코드가 그대로 운영에 올라갈 수 있었다.
#
# DB 는 필요 없다. 테스트는 스프링 컨텍스트를 띄우지 않고,
# src/main/resources/properties/database.properties (.gitignore 대상) 도 쓰지 않는다.
name: 테스트

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 올리면 앞선 실행은 취소한다
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mvn test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 배포 서버가 자바 11 이상을 요구하고, 로컬 개발도 17 로 맞춰져 있다
      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 테스트
        run: mvn -B test

      # 실패했을 때 어느 테스트가 왜 깨졌는지 보려면 보고서가 필요하다
      - name: 실패 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
