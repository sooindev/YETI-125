# 로그인 요청 빈도 제한 — 적용 지점 (server 블록용)
#
# 사이트의 server 블록 안에서 include 한다.
#
#   sudo install -m 644 config/nginx/yeti-125-login.conf /etc/nginx/snippets/
#   # server { ... 안에 한 줄 추가:
#   #     include snippets/yeti-125-login.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# yeti-125-login-zone.conf 를 먼저 넣어야 한다 — zone 이 없으면 nginx -t 가 실패한다.
#
# 정확 일치(=) location 이라 다른 location 의 설정을 하나도 물려받지 않는다.
# proxy_set_header 를 여기에 다시 적는 이유다. 특히 X-Forwarded-For 를 빠뜨리면
# 톰캣이 요청자 주소를 알 수 없게 되고, 앱 쪽 LoginRateLimitFilter 가
# 모든 요청을 한 통에 담아 정작 관리자가 못 들어온다.
#
# proxy_pass 주소와 헤더 목록은 사이트의 기존 location 과 같아야 한다.
# 톰캣을 다른 포트로 옮겼다면 여기도 함께 고칠 것.
#
# 429 응답 본문은 nginx 의 기본 오류 화면이라 JSON 이 아니다. 로그인 화면은
# 그때 일반 오류 문구를 보여준다 — 여기까지 닿는 것은 공격뿐이라 그대로 둔다.

location = /admin/loginProc {
    limit_req zone=yeti_login burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8080;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
