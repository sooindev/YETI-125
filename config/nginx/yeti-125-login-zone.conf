# 로그인 요청 빈도 제한 — 저장 영역 선언 (http 블록용)
#
# limit_req_zone 은 http 블록에만 놓을 수 있다. 우분투 nginx 는 http 블록에서
# /etc/nginx/conf.d/*.conf 를 자동으로 include 하므로 이 파일은 거기에 두면 된다.
#
#   sudo install -m 644 config/nginx/yeti-125-login-zone.conf /etc/nginx/conf.d/
#
# 10m 은 약 16만 개 주소를 담는다. 넘치면 nginx 가 오래된 것부터 버린다.
#
# 분당 10회 — 사람이 이 속도로 로그인할 일은 없다. 계정 잠금이 5회에서 먼저 걸린다.
# 앱 쪽 LoginRateLimitFilter 는 일부러 이보다 느슨한 20회다. 1차는 여기이고
# 그쪽은 이 설정이 빠졌을 때를 위한 그물이라, 평소에 먼저 걸리면 원인만 헷갈린다.

limit_req_zone $binary_remote_addr zone=yeti_login:10m rate=10r/m;
